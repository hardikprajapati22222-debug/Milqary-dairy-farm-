<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milqary Admin Preview</title><style>body{font-family:Arial;background:#f4f9ff;color:#17324d;padding:20px;max-width:650px;margin:auto}.card{background:white;padding:20px;border-radius:14px}input{padding:10px;width:100%;margin:6px 0 14px;box-sizing:border-box}button{background:#0877c9;color:white;border:0;padding:12px;border-radius:8px}</style></head><body><div class="card"><h1>Milqary Admin Preview</h1><p>આ માત્ર તમારા બ્રાઉઝરમાં ભાવ બદલવાની પ્રિવ્યૂ સુવિધા છે. આ સુરક્ષિત Live Admin Panel નથી અને વેબસાઇટના Live ભાવ બદલતું નથી.</p><label>ગાયનું દૂધ (₹/લીટર)</label><input id="cow" type="number" value="70"><label>ભેંસનું દૂધ (₹/લીટર)</label><input id="buffalo" type="number" value="80"><label>દેશી ઘી (₹/કિલો)</label><input id="ghee" type="number" value="1500"><button onclick="localStorage.setItem('milqaryPreview',JSON.stringify({cow:cow.value,buffalo:buffalo.value,ghee:ghee.value}));alert('આ બ્રાઉઝરમાં પ્રિવ્યૂ ભાવ સેવ થયા')">પ્રિવ્યૂ સેવ કરો</button><p><a href="/">વેબસાઇટ પર પાછા જાઓ</a></p></div><script>let s=JSON.parse(localStorage.getItem('milqaryPreview')||'{}');['cow','buffalo','ghee'].forEach(k=>{if(s[k])document.getElementById(k).value=s[k]})</script></body></html>
